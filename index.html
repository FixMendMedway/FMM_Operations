/* FMM Operations v2.6 · unobtrusive cross-module navigation */
.fmm26-search-launch{width:calc(100% - 20px);margin:12px 10px 5px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid #65747b;border-radius:9px;color:#f5fbf1;background:#34434a;font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
.fmm26-search-launch:hover,.fmm26-search-launch:focus-visible{background:#40545d;border-color:#a6ce39;outline:2px solid #a6ce3970;outline-offset:1px}
.fmm26-search-launch kbd{font:inherit;color:#c8d3d0;font-size:10px;border:1px solid #7b8b90;border-radius:4px;padding:3px 5px;white-space:nowrap}
.fmm26-sidehub{margin:15px 10px;padding:11px 12px;border:1px solid #53636a;border-radius:9px;background:#243239;color:#eff6ee}

.fmm26-sidehub small{display:block;color:#bac5c8;font-size:11px;line-height:1.4;margin:3px 0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmm26-sidehub button{width:100%;text-align:center;border:1px solid #94b461;border-radius:6px;background:#344c36;color:#fff;padding:8px 7px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.fmm26-sidehub button:hover,.fmm26-sidehub button:focus-visible{background:#435e42}
.fmm26-search-box{display:flex;align-items:center;border:2px solid #97b955;border-radius:9px;background:white;padding:2px 10px;gap:8px}
.fmm26-search-box input{flex:1;min-width:0;padding:12px 4px;font-size:15px;border:0!important;outline:0!important;background:transparent!important}
.fmm26-search-box kbd{font-size:11px;color:#6b7c81}
.fmm26-search-help{font-size:12px;color:#586c70;margin:10px 2px 12px}
.fmm26-filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.fmm26-filter{border:1px solid #d3dddd;background:#f3f6f5;color:#33464d;border-radius:18px;padding:5px 10px;font:inherit;font-size:11px;font-weight:750;cursor:pointer}
.fmm26-filter[aria-pressed="true"]{border-color:#799c23;background:#e4f0c7;color:#263c1d}
.fmm26-result-wrap{max-height:min(53vh,510px);overflow:auto;border:1px solid #e1e8e7;border-radius:9px;background:white}
.fmm26-hit{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:0;border-bottom:1px solid #edf1ef;text-align:left;background:#fff;color:#26353d;font:inherit;cursor:pointer}
.fmm26-hit:last-child{border-bottom:0}.fmm26-hit:hover,.fmm26-hit:focus-visible{background:#eef7da;outline:0}
.fmm26-hit-type{flex:0 0 84px;font-size:10px;font-weight:800;text-transform:uppercase;color:#536971;letter-spacing:.3px}
.fmm26-hit-body{display:block;min-width:0;flex:1}.fmm26-hit-body strong{display:block;line-height:1.4;font-size:13px;word-break:break-word}
.fmm26-hit-body small{display:block;margin-top:3px;color:#65787b;font-size:11px;line-height:1.45;word-break:break-word}
.fmm26-hit-go{font-size:18px;color:#677b7b}
.fmm26-hit-info{padding:9px 10px;font-size:12px;color:#66797c}
.fmm26-hub-lead{line-height:1.6;margin:2px 0 14px}.fmm26-hub-ref{color:#5e726e;font-size:12px;font-weight:800;letter-spacing:.3px}
.fmm26-hub-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0 17px}
.fmm26-hub-stat{border:1px solid #dce5df;border-radius:8px;padding:11px 12px;background:#f8faf8}
.fmm26-hub-stat span{display:block;text-transform:uppercase;letter-spacing:.4px;color:#63777b;font-size:10px;font-weight:800}
.fmm26-hub-stat strong{display:block;margin-top:5px;color:#26353d;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.fmm26-hub-stat small{font-size:11px;line-height:1.4;color:#607278}
.fmm26-hub-heading{margin:15px 0 8px;color:#26353d;font-size:13px;font-weight:800}
.fmm26-hub-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.fmm26-hub-link{border:1px solid #cbd8d5;border-radius:8px;background:#fff;padding:10px 8px;font:inherit;font-size:12px;font-weight:750;color:#33474b;text-align:left;cursor:pointer}
.fmm26-hub-link:hover,.fmm26-hub-link:focus-visible{border-color:#9fbe57;background:#eff7dc}
.fmm26-hub-link:disabled{color:#8b9699;background:#f4f5f4;cursor:not-allowed}
.fmm26-hub-mini{border:1px solid #dbe4e4;border-radius:8px;padding:8px 11px;background:white}
.fmm26-hub-mini button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #e5ebea;cursor:pointer;padding:9px 4px;color:#31474a;font:inherit;font-size:12px}
.fmm26-hub-mini button:last-child{border:0}.fmm26-hub-mini button:hover{color:#567b18}

.fmm26-gantt-link:hover,.fmm26-gantt-link:focus-visible{text-decoration-color:#6f9529;color:#4a6d17}
.fmm26-row-hub{font-size:10px!important;margin-left:4px!important;padding:5px 7px!important}

@media(max-width:700px){.fmm26-search-launch{width:calc(100% - 20px);margin:8px 10px}.fmm26-hit-type{flex-basis:65px;font-size:9px}.fmm26-hub-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.fmm26-hub-links{grid-template-columns:repeat(2,minmax(0,1fr))}}

function validateBackup(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('The backup must contain a valid JSON object');
 if(raw.schema===2){
  if(!Array.isArray(raw.projects)||!Array.isArray(raw.resources||[]))throw Error('Company backup is missing projects/resources arrays');
  if(raw.projects.length>1000)throw Error('This backup contains more than 1,000 projects; import was stopped to avoid data loss');
  const seen=new Set();
  for(let n=0;n<raw.projects.length;n++){
   const p=raw.projects[n];
   if(!p||typeof p!=='object'||typeof p.title!=='string'||!valid(p.start)||!valid(p.deadline||p.finish||p.start))throw Error('Invalid project details/dates at job '+(n+1));
   if(p.id){if(!/^[a-zA-Z0-9_-]{1,100}$/.test(String(p.id)))throw Error('Unsafe project ID in backup');if(seen.has(p.id))throw Error('Duplicate project ID in backup');seen.add(p.id)}
   if(!Number.isFinite(Number(p.contractValue||0))||Number(p.contractValue||0)<0)throw Error('Invalid contract value at job '+(n+1));
   if(!Array.isArray(p.tasks)||!Array.isArray(p.cash)||!Array.isArray(p.checklist))throw Error('Job '+(n+1)+' is missing task, cash or checklist records');
   if(p.tasks.length>2000||p.cash.length>5000||p.checklist.length>300)throw Error('Job '+(n+1)+' exceeds safety limits');
   for(const t of p.tasks){if(!t||typeof t.title!=='string'||!valid(t.start)||!valid(t.finish)||t.finish<t.start||!Number.isFinite(Number(t.cost||0))||Number(t.cost||0)<0)throw Error('Invalid task in job '+(n+1));if(t.id&&!/^[a-zA-Z0-9_-]{1,100}$/.test(String(t.id)))throw Error('Unsafe task ID in backup');}
   for(const c of p.cash){if(!c||!valid(c.date)||!Number.isFinite(Number(c.amount))||Number(c.amount)<0||!['in','out'].includes(c.type))throw Error('Invalid cash event in job '+(n+1));if(c.id&&!/^[a-zA-Z0-9_-]{1,100}$/.test(String(c.id)))throw Error('Unsafe cash event ID in backup');}
  }
  if(!Array.isArray(raw.companyCash||[])||!Array.isArray(raw.absences||[]))throw Error('Invalid business cash or unavailable-date records');for(const r of (raw.resources||[])){if(typeof r.name!=='string'||!Number.isFinite(Number(r.capacity||1))||Number(r.capacity||1)<=0)throw Error('Invalid resource in backup');}
  for(const c of (raw.companyCash||[])){if(!valid(c.date)||!Number.isFinite(Number(c.amount))||Number(c.amount)<0)throw Error('Invalid overhead cash event');if(c.id&&!/^[a-zA-Z0-9_-]{1,100}$/.test(String(c.id)))throw Error('Unsafe overhead ID in backup');}
  for(const a of (raw.absences||[])){if(!valid(a.start)||!valid(a.finish)||a.finish<a.start)throw Error('Invalid resource absence dates');}
  return true;
 }
 if(raw.project&&Array.isArray(raw.tasks)){
  if(raw.tasks.length>2000)throw Error('More than 2,000 tasks in imported project');
  for(const t of raw.tasks){if(!valid(t.start)||!valid(t.finish)||t.finish<t.start)throw Error('Project file contains an invalid activity date');}
  return true;
 }
 throw Error('Unrecognised backup format');
}

 }

  let j=newJob(old.project.title||'Imported project',old.project.start||today());Object.assign(j,{title:old.project.title||'Imported project',client:old.project.client||'',ref:old.project.ref||'',site:old.project.site||'',manager:old.project.manager||'FMM',notes:old.project.notes||'',deadline:old.project.finish||j.deadline});j.tasks=old.tasks.map(t=>({...t,id:t.id||id(),units:1,start:t.start||j.start,finish:t.finish||j.finish,cost:Math.max(0,+t.cost||0),resource:t.resource||''}));syncDates(j);return j;

function clashes(){let dayMap=new Map();const future=today();for(const t of allTasks()){
 if(!t.resource||['lead','cancelled','completed'].includes(t.pstatus)||t.status==='complete')continue;
 let st=t.start<future?future:t.start,end=t.finish;let count=0;
 for(let d=st;d<=end&&count<550;d=shift(d,1),count++){if(!isWorkDay(d))continue;let key=t.resource.toLowerCase().trim()+'|'+d;const a=dayMap.get(key)||[];a.push(t);dayMap.set(key,a)}
 }
 let out=[];for(const [key,tasks] of dayMap){const split=key.lastIndexOf('|'),res=key.slice(0,split),day=key.slice(split+1),total=tasks.reduce((s,t)=>s+(+t.units||1),0),leave=unavailable(res,day);const capacity=leave.length?0:resourceCapacity(res);if(total>capacity+1e-6)out.push({res,day,tasks,total,capacity,leave:leave.map(x=>x.note||'Unavailable').join(', '),tentative:tasks.some(t=>t.pstatus==='quoted')})}

function healthChecks(){
 let items=[];
 for(const p of data.projects){
  const isConfirmed=['confirmed','active','hold'].includes(p.status),key=p.ref||p.title;
  if(!isConfirmed)continue;
  if(!p.tasks.length)items.push({pid:p.id,level:'warning',label:key+': no work activities entered'});
  if(p.finish>p.deadline)items.push({pid:p.id,level:'warning',label:key+': programme exceeds agreed target finish'});
  const r=readiness(p);if(r.done<r.total)items.push({pid:p.id,level:'warning',label:key+': '+(r.total-r.done)+' essential pre-start checks incomplete'});
  if(+p.contractValue>0&&!p.cash.some(c=>c.type==='in'))items.push({pid:p.id,level:'warning',label:key+': no expected customer payment date entered'});
  if(+p.contractValue>0&&costs(p)>+p.contractValue)items.push({pid:p.id,level:'warning',label:key+': estimated direct costs exceed contract value'});
  for(const t of p.tasks){if(!t.resource)items.push({pid:p.id,level:'warning',label:key+': unassigned resource — '+t.title});}
 }
 if(!data.projects.length)items.push({pid:'',level:'info',label:'Add your first job to see planning checks'});
 return items;
}

function timelineParameters(items){let dates=items.flatMap(x=>[x.start,x.finish]).filter(valid);let b=dates.length?dates.reduce((a,x)=>x<a?x:a):today(),e=dates.length?dates.reduce((a,x)=>x>a?x:a):shift(today(),90);b=shift(b,-7);e=shift(e,14);let span=Math.min(1825,Math.max(30,diff(b,e)+1));let daypx=data.scale==='day'?29:data.scale==='month'?3.2:8.5;let minpx=data.scale==='month'?4.3:daypx;return {start:b,days:span,width:Math.round(span*minpx),px:minpx,tick:data.scale==='day'?1:data.scale==='week'?7:30}}

function renderGantt(rows,scope){if(!rows.length)return `<div class="empty">No programme activities yet. Add a project or activity to get started.</div>`;let cfg=timelineParameters(rows),ticks=[],guides=[];for(let d=0;d<cfg.days;){let s=shift(cfg.start,d),step=cfg.tick,label='';if(data.scale==='month'){let dt=objDate(s),firstNext=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,1));step=Math.max(1,Math.round((firstNext-dt)/86400000));label=dt.toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'});}else{label=data.scale==='week'?pretty(s).replace(/ \d{4}$/,''):s.slice(8);}ticks.push(`<div class="tick" style="width:${Math.min(step,cfg.days-d)*cfg.px}px">${label}</div>`);if(data.scale==='month'&&d>0)guides.push(d*cfg.px);d+=step;}
let left=`<div class="gleft"><div class="ghead-left">${scope==='portfolio'?'PROJECT / CLIENT':'ACTIVITY / ASSIGNED RESOURCE'}</div>${rows.map(x=>`<div class="gleftrow"><div style="min-width:0"><strong>${E(x.title)}</strong><small>${E(x.subtitle||'—')}</small></div><span class="mini">${x.cost!=null?gbp(x.cost):''}</span></div>`).join('')}</div>`;
let right=`<div class="gdates"><div class="ghead" style="width:${cfg.width}px">${ticks.join('')}</div>${rows.map(x=>{let sl=Math.max(0,diff(cfg.start,x.start))*cfg.px,sr=Math.min(cfg.width,(diff(cfg.start,x.finish)+1)*cfg.px),w=Math.max(12,sr-sl),complete=x.status==='completed'||x.status==='complete',cls=x.status==='hold'?'hold':complete?'completed':x.status==='quoted'?'quoted':'';let overdue=x.kind==='project'&&data.projects.find(p=>p.id===x.id)?.deadline<x.finish?'overdue':'';return `<div class="gtrack" style="width:${cfg.width}px;--tickpx:${cfg.tick*cfg.px}px;${data.scale==='month'?'background-image:none;':''}">${data.scale==='month'?guides.map(g=>`<i style="position:absolute;left:${g}px;top:0;bottom:0;border-left:1px solid #dce4e4;pointer-events:none"></i>`).join(''):''}<div class="gbar ${cls} ${overdue}" data-gantt="${x.kind}" data-id="${x.id}" data-pid="${x.pid||''}" data-px="${cfg.px}" data-start="${x.start}" data-finish="${x.finish}" style="left:${sl}px;width:${w}px" title="${E(x.title)}: ${pretty(x.start)} – ${pretty(x.finish)}">${w>=42?'<span class="handle left" data-handle="start"></span>':''}<small>${w>65?E(x.title):''}</small>${w>=42?'<span class="handle right" data-handle="finish"></span>':''}</div></div>`}).join('')}</div>`;

}

function moveProject(pid,newStart){let j=data.projects.find(p=>p.id===pid);if(!j||!valid(newStart))return;let delta=diff(j.start,newStart);if(!delta)return;j.start=newStart;j.finish=shift(j.finish,delta);j.tasks.forEach(t=>{t.start=shift(t.start,delta);t.finish=shift(t.finish,delta)});j.cash.filter(x=>x.status!=='actual').forEach(c=>{c.date=shift(c.date,delta)});j.deadline=shift(j.deadline,delta);syncDates(j)}
function updateDrag(info,dx){const days=Math.round(dx/info.px);const {kind,id,pid,mode}=info;
if(!days)return;
if(kind==='project'){
 let p=data.projects.find(x=>x.id===id);if(!p)return;
 if(mode==='finish'){let newDeadline=shift(p.deadline,days);if(diff(p.start,newDeadline)<0)throw Error('Target date cannot precede project start');p.deadline=newDeadline}
 else moveProject(id,shift(info.start,days));
}else{let p=data.projects.find(x=>x.id===pid),t=p?.tasks.find(x=>x.id===id);if(!t)return;
 if(mode==='move'){t.start=shift(info.start,days);t.finish=shift(info.finish,days)}
 else if(mode==='start'){let newDate=shift(info.start,days);if(diff(newDate,t.finish)<0)throw Error('Start cannot follow finish');t.start=newDate}
 else{let newDate=shift(info.finish,days);if(diff(t.start,newDate)<0)throw Error('Finish cannot precede start');t.finish=newDate}
 syncDates(p);
}}

function showProgrammePrint(){
 let scope=data.view==='project'?'task':'portfolio',j=selected();
 let rows=scope==='task'?projectRows(j):
 data.projects.map(p=>({title:p.title,subtitle:[p.ref,p.client].filter(Boolean).join(' · '),start:p.start,finish:p.finish,status:p.status,cost:p.contractValue,kind:'project'}));
 if(!rows.length){toast('Add a project or activity before printing a Gantt');return}
 const all=rows.flatMap(x=>[x.start,x.finish]),first=shift(all.reduce((a,b)=>a<b?a:b),-7),last=shift(all.reduce((a,b)=>a>b?a:b),7);
 const totalWeeks=Math.ceil((diff(first,last)+1)/7),weeksPerPage=12,sections=[];
 for(let page=0;page<Math.min(50,Math.ceil(totalWeeks/weeksPerPage));page++){
  let start=shift(first,page*weeksPerPage*7),remain=totalWeeks-page*weeksPerPage,weeks=Math.min(weeksPerPage,remain),end=shift(start,weeks*7-1);
  let included=rows.filter(t=>t.start<=end&&t.finish>=start);
  let ticks=Array.from({length:weeks},(_,i)=>`<th>${pretty(shift(start,7*i)).replace(/ \d{4}$/,'')}</th>`).join('');
  let barRows=included.map(t=>{
   let left=Math.max(0,diff(start,t.start)/(weeks*7)*100),right=Math.min(100,(diff(start,t.finish)+1)/(weeks*7)*100),ww=Math.max(.5,right-left);
   let fill=t.kind==='phase'?'#384a51':t.status==='hold'?'#c99654':t.status==='quoted'?'#aebfc5':t.status==='completed'?'#7a9c8e':'#a6ce39';
   return `<tr><td><strong>${t.kind==='phase'?'PHASE · ':t.child?'↳ ':''}${E(t.title)}</strong><br><small>${E(t.subtitle||'')}</small></td><td>${pretty(t.start)}<br>${pretty(t.finish)}</td><td colspan="${weeks}" class="pcell"><div class="pline" style="background-size:${100/weeks}% 100%"><div class="pbar" style="left:${left}%;width:${ww}%;background:${fill}"></div></div></td></tr>`;
  }).join('');
  sections.push(`<div class="printbox"><h2>Programme period ${page+1} of ${Math.ceil(totalWeeks/weeksPerPage)} · ${pretty(start)} – ${pretty(end)}</h2><table class="programTable"><thead><tr><th style="width:26%">${scope==='task'?'Activity / resource':'Job / client'}</th><th style="width:13%">Dates</th>${ticks}</tr></thead><tbody>${barRows||`<tr><td colspan="${weeks+2}">No scheduled activities in this period.</td></tr>`}</tbody></table></div>`);
 }
 $('#printArea').innerHTML=`<div class="printmast"><h1>FIX & MEND MEDWAY · ${scope==='task'?'PROJECT':'COMPANY'} GANTT PROGRAMME</h1><p>${scope==='task'?E(j.ref+' — '+j.title):'Master company programme'} · Generated ${pretty(today())} · Planning programme</p></div>${sections.join('')}<p class="printnote">Printed copy uncontrolled after issue. The bars span calendar dates; clash checks follow the chosen resource calendar.</p>`;
 window.print();
}

async function importFile(file){if(!file)return;try{if(file.size>8*1024*1024)throw Error('File exceeds 8 MB; contact support before importing');let x=JSON.parse(await file.text());validateBackup(x);let v=migrate(x);
 if(v.schema===2){if(!confirm('REPLACE this company register? This discards current jobs. Download your current backup first.'))return;try{localStorage.setItem(CHECKPOINT,JSON.stringify(data))}catch(e){}data=v;startupWarning='';lastSavedSerialized=localStorage.getItem(STORE);if(!save(true))throw Error('Backup could not be stored — download another copy now');undoStack=[];render();toast('Company backup restored');}
 else{if(startupWarning)throw Error('Resolve saved-data recovery mode first');if(!staleGuard())throw Error('Newer company data detected; repeat import');if(data.projects.some(p=>p.ref&&v.ref&&p.ref.toLowerCase()===v.ref.toLowerCase())){if(!confirm('A job with this reference exists. Import as another job?'))return;let base=(v.ref||'PROJECT')+'-COPY',candidate=base,n=2;while(data.projects.some(p=>p.ref?.toLowerCase()===candidate.toLowerCase()))candidate=base+'-'+n++;v.ref=candidate}v.id=id();if(v.phases){let idMap=new Map();v.phases.forEach(ph=>{let old=ph.id;ph.id=id();idMap.set(old,ph.id)});v.tasks.forEach(t=>{if(t.phaseId)t.phaseId=idMap.get(t.phaseId)||""})}v.tasks.forEach(t=>t.id=id());v.cash.forEach(c=>c.id=id());v.checklist.forEach(c=>c.id=id());mutate(()=>{data.projects.push(v);data.currentProject=v.id;data.view='project'},'Single-project file imported into the company programme');}
}catch(e){toast('Import failed: '+e.message)}}

 const crc=bytes=>{let c=0xffffffff;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0};
 for(const [name,text] of entries){let file=enc.encode(name),bytes=typeof text==='string'?enc.encode(text):text;let sum=crc(bytes),local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(bytes.length),...u32(bytes.length),...u16(file.length),...u16(0),...file]);parts.push(local,bytes);dir.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(sum),...u32(bytes.length),...u32(bytes.length),...u16(file.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...file]));offset+=local.length+bytes.length;}

}

   const previous=currentWindow([],true);
   mutate(()=>{
     const r=ensureCashRange();
     if(value==='custom'&&r.preset!=='custom'){
       r.start=previous.start;r.end=previous.end;
     }
     r.preset=value;
     if(value==='1w')r.granularity='day';
     else if(value==='1m'||value==='3m')r.granularity='week';
     else if(value==='6m'||value==='12m')r.granularity='month';
   },'Cashflow date range updated');
   return;
 }
 if(el.id==='cashRangeDetail'){
   if(!CASH_PERIOD_DETAIL.some(([k])=>k===el.value))return;
   mutate(()=>{ensureCashRange().granularity=el.value},'Cashflow chart detail updated');
   return;
 }
 if(el.id==='cashRangeStart'||el.id==='cashRangeEnd'){
   const from=document.getElementById('cashRangeStart')?.value;
   const to=document.getElementById('cashRangeEnd')?.value;
   if(!valid(from)||!valid(to)||to<from){toast('Enter valid custom dates (the end must be on or after the start)');return}
   mutate(()=>{const r=ensureCashRange();r.preset='custom';r.start=from;r.end=to},'Custom cashflow dates updated');
   return;
 }
},true);

ensureCashRange();
window.FMMCompany.version='1.5.0';
window.FMMCompany.cashWindow=()=>({...currentWindow([],true),granularity:ensureCashRange().granularity});

const FMM_PAL=['#e6efe0','#e5eff5','#f5ebda','#f1e5ec','#e7e6f4','#dff1eb','#f4e5d9','#e5e9eb','#edf2d9','#efe5da','#e3edf2','#f0e7e3'];

const FMM_STATES=['Planned','Ordered','In progress','Complete'];
const FMM_PAYMETHODS=['To buy','Already owned','N/A'];
const FMM_DEC=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const FMM_NUM=n=>{let x=Number(n);return Number.isFinite(x)?x:0};

function fmmNewQuote(){return {id:id(),ref:'',title:'',client:'',site:'',notes:'',status:'draft',createdAt:today(),updatedAt:today(),acceptedAt:'',convertedAt:'',projectId:'',packages:FMM_PACKAGE_DEFAULTS.map((name,i)=>({code:'P'+(i+1),name})),lines:[]};}
function fmmEnsureData(){if(!Array.isArray(data.quotations))data.quotations=[];for(const q of data.quotations){q.packages ||= FMM_PACKAGE_DEFAULTS.map((name,i)=>({code:'P'+(i+1),name}));q.lines ||= [];q.projectId ||= '';q.status ||= 'draft';q.lines.forEach(l=>{l.supply ||= 'To buy';l.status ||= 'Planned';if(l.remainingOverride===undefined)l.remainingOverride=null;});}for(const p of data.projects){p.archivedAt ||= '';p.quoteId ||= '';} }

function fmmLinkedQuote(p){return data.quotations.find(q=>q.id===p?.quoteId||q.projectId===p?.id);}
function fmmRate(l){return FMM_DEC(FMM_NUM(l.qty)*FMM_NUM(l.rate));}
function fmmLineCost(l){const budget=fmmRate(l),sell=FMM_DEC(budget*(1+FMM_NUM(l.markup)/100)),actual=FMM_NUM(l.actual);
const owned=l.type==='Material'&&l.supply==='Already owned';let remaining=owned?0:l.remainingOverride!==null&&l.remainingOverride!==undefined&&l.remainingOverride!==''?Math.max(0,FMM_NUM(l.remainingOverride)):l.status==='Complete'&&actual>0?0:Math.max(0,FMM_DEC(budget-actual));
let forecast=FMM_DEC(actual+remaining),stock=owned?budget:0;return {budget,sell,actual,remaining,forecast,stock,economic:FMM_DEC(forecast+stock),variance:FMM_DEC(budget-forecast)};}
function fmmTotals(q,filter){let out={budget:0,sell:0,actual:0,remaining:0,forecast:0,stock:0,economic:0,variance:0,count:0,byType:Object.fromEntries(FMM_TYPES.map(k=>[k,{budget:0,actual:0,remaining:0,forecast:0,stock:0,sell:0,economic:0}]))};
 for(const l of q.lines){if(filter&&filter.pkg&&filter.pkg!==l.pkg)continue;if(filter&&filter.type&&filter.type!==l.type)continue;let n=fmmLineCost(l);out.count++;for(const k of ['budget','sell','actual','remaining','forecast','stock','economic','variance'])out[k]=FMM_DEC(out[k]+n[k]);let ty=out.byType[l.type]||out.byType.Other;for(const k of ['budget','sell','actual','remaining','forecast','stock','economic'])ty[k]=FMM_DEC(ty[k]+n[k]);}out.cashProfit=FMM_DEC(out.sell-out.forecast);out.economicProfit=FMM_DEC(out.sell-out.economic);return out;}

',l.id)}</td></tr>`}).join('')||'<tr><td colspan="15"><div class="empty">No items match. Add the first item or clear the filter.</div></td></tr>'}</tbody></table></div>

function fmmParseCSV(s){let a=[],row=[],cur='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){cur+='"';i++}else if(c==='"')quoted=false;else cur+=c;}else if(c==='"'){quoted=true}else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cur);if(row.some(x=>x.trim()))a.push(row);row=[];cur=''}else cur+=c;}if(quoted)throw Error('Unclosed CSV quote');row.push(cur);if(row.some(x=>x.trim()))a.push(row);return a;}
async function fmmImportCSV(file,q){try{if(!file||file.size>2*1024*1024)throw Error('Use a CSV file smaller than 2 MB');if(q.projectId)throw Error('Accepted project pricing is locked; import into a new quotation');let text=await file.text(),rows=fmmParseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('CSV needs a header and at least one item');let keys=rows.shift().map(x=>x.trim().toLowerCase().replace(/[\s_()%-]+/g,''));let find=(...names)=>names.map(x=>keys.indexOf(x)).find(x=>x>=0)??-1;let idx={pkg:find('package','pkg','group'),type:find('costtype','type','category'),description:find('description','item','task'),qty:find('qty','quantity'),unit:find('unit','units'),rate:find('costrate','rate','unitcost'),markup:find('markup','markuppercent'),actual:find('actualspend','actualcash'),rem:find('stilltospendoverride','remainingoverride'),supply:find('supply'),status:find('status')};if(['pkg','type','description','qty','rate'].some(k=>idx[k]<0))throw Error('Expected CSV columns: Group, Cost Type, Description, Qty, Cost Rate');let parsed=[];for(let i=0;i<rows.length;i++){let row=rows[i],get=k=>idx[k]<0?'':(row[idx[k]]||'').trim();if(!get('description'))continue;let l=fmmEmptyLine();l.pkg=get('pkg')||'P1';const groupMatch=l.pkg.match(/^G(\d+)$/i);if(groupMatch&&q.packages[+groupMatch[1]-1])l.pkg=q.packages[+groupMatch[1]-1].code;l.type=get('type')||'Material';l.description=get('description').slice(0,240);l.qty=Number(get('qty')||1);l.unit=get('unit')||'ea';l.rate=Number(get('rate')||0);l.markup=Number(get('markup')||0);l.actual=Number(get('actual')||0);l.remainingOverride=get('rem')===''?null:Number(get('rem'));l.supply=get('supply')||'To buy';l.status=get('status')||'Planned';if(!q.packages.some(p=>p.code===l.pkg)||!FMM_TYPES.includes(l.type)||![l.qty,l.rate,l.markup,l.actual,l.remainingOverride??0].every(n=>Number.isFinite(n)&&n>=0)||l.markup>1000)throw Error('Invalid group/type/amount at CSV line '+(i+2));if(!FMM_UNITS.includes(l.unit))l.unit='ea';if(!FMM_ const fmmQuoteDetailPrior=fmmQuoteDetail;

 let output=fmmQuoteDetailPrior(q);
 if(q.legacyProjectId&&!q.projectId){
  const p=data.projects.find(p=>p.id===q.legacyProjectId);
  const original=FMM_CURRENCY(q.legacyQuoteValue);
  const priced=FMM_CURRENCY(fmmTotals(q).sell);
  const isDifferent=q.lines.length>0 && Math.abs(fmmTotals(q).sell-FMM_NUM(q.legacyQuoteValue))>.009;
  const message=`<div class="note warning"><strong>Imported existing quotation:</strong> ${E(q.ref)} was already entered in FMM Operations with a quoted value of <strong>${original}</strong>. The backup did not include itemised labour or materials, so those costs are intentionally blank. Add your real cost lines before accepting and converting. ${q.lines.length?`Current itemised selling sum: <strong>${priced}</strong>${isDifferent?' (does not yet match the existing quoted value)':''}.`:''} On conversion this will <strong>activate the existing job</strong> and retain its cash entries, activities and readiness checks rather than creating a duplicate. ${p?'':'<strong>Warning: the original project can no longer be found.</strong>'}</div>`;
  output=output.replace(fmmNote(),fmmNote()+message);
 }
 return output;
};
const fmmConvertPrior=fmmConvert;

 if(q.projectId){toast('Already linked to a project');return;}
 const p=data.projects.find(p=>p.id===q.legacyProjectId);
 if(!p){toast('Original quoted project was not found; conversion stopped');return;}
 if(p.quoteId||p.status!=='quoted'){toast('Original job is no longer an unconverted quotation; conversion stopped');return;}
 if(q.status!=='accepted'){toast('Mark the quotation accepted before converting');return;}
 if(!q.lines.length){toast('Enter itemised labour and material costs before converting');return;}
 let total=fmmTotals(q);if(!(total.sell>0)){toast('Price the quotation before converting');return;}
 const previous=FMM_NUM(p.contractValue),difference=Math.abs(previous-total.sell)>.009;
 const warning=difference?`\n\nWARNING: the original Operations quoted value was ${FMM_CURRENCY(previous)}, while the itemised rates total ${FMM_CURRENCY(total.sell)}. Converting will use the itemised total as the project selling value.`:'';
 if(!confirm(`Convert the EXISTING project ${q.ref} – ${q.title} to Active?\n\nThis keeps its existing ID, activities, resource bookings, readiness checklist and cash entries.\nNew group phases will be added without inventing dates.\nOriginal cost rates will be locked at conversion.${warning}`))return;
 let success=mutate(()=>{
  p.status='active';p.quoteId=q.id;p.contractValue=total.sell;p.archivedAt='';

  p.phases ||= [];

   if(already.has(pkg.code))continue;

const fmmCloudBytes=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a;};
const fmmCloudBase64=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function fmmCloudSignIn(){
 if(!fmmCloudCanConnect()){toast('Open the HTTPS GitHub Pages application to sign in');return;}
 if(!fmmCloud.clientId){toast('Enter your Microsoft Application ID in OneDrive settings first');return;}
 if(!crypto.subtle){toast('Secure connection required');return;}
 const verifier=fmmCloudBase64(fmmCloudBytes(48)),state=fmmCloudBase64(fmmCloudBytes(24));
 const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
 sessionStorage.setItem('fmm-cloud-oauth-pkce',JSON.stringify({verifier,state,clientId:fmmCloud.clientId,redirect:fmmCloudRedirect(),at:Date.now()}));
 const u=new URL('https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize');
 for(const [k,v] of Object.entries({client_id:fmmCloud.clientId,response_type:'code',redirect_uri:fmmCloudRedirect(),response_mode:'query',scope:FMM_CLOUD_SCOPES,state,code_challenge:fmmCloudBase64(digest),code_challenge_method:'S256',prompt:'select_account'}))u.searchParams.set(k,v);
 window.location.assign(u.href);

function fmmCloudAcceptToken(t){
 fmmCloud.token=t.access_token;fmmCloud.refreshToken=t.refresh_token||fmmCloud.refreshToken;
 fmmCloud.expires=Date.now()+Math.max(60,(+t.expires_in||3600)-90)*1000;

async function fmmCloudCallback(){
 const u=new URL(location.href);if(!u.searchParams.has('code')&&!u.searchParams.has('error'))return;
 const code=u.searchParams.get('code'),state=u.searchParams.get('state'),err=u.searchParams.get('error');
 for(const k of ['code','state','error','error_description','session_state'])u.searchParams.delete(k);
 try{history.replaceState(null,'',u.pathname+(u.search||'')+(u.hash||''));}catch(e){}
 let saved=null;try{saved=JSON.parse(sessionStorage.getItem('fmm-cloud-oauth-pkce')||'null');}catch(e){}
 sessionStorage.removeItem('fmm-cloud-oauth-pkce');
 if(err){fmmCloudSetState('Microsoft sign-in cancelled','warn');toast('Microsoft sign-in: '+err);return;}
 if(!saved||state!==saved.state||saved.clientId!==fmmCloud.clientId||saved.redirect!==fmmCloudRedirect()||Date.now()-saved.at>10*60*1000){fmmCloudSetState('Sign-in verification failed','warn');toast('Microsoft sign-in verification failed; try again');return;}
 try{
  const body=new URLSearchParams({client_id:saved.clientId,grant_type:'authorization_code',code,redirect_uri:saved.redirect,code_verifier:saved.verifier,scope:FMM_CLOUD_SCOPES});
  const r=await fetch(FMM_CLOUD_AUTH_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),cache:'no-store'});

async function fmmCloudAuth(){
 if(fmmCloud.token&&Date.now()<fmmCloud.expires)return fmmCloud.token;
 if(!fmmCloud.refreshToken){fmmCloudSetState('Microsoft sign-in required · local edits retained','warn');throw Error('Microsoft session has expired. Sign in again. Your local work is safe.');}
 if(fmmCloud.refreshPromise)return fmmCloud.refreshPromise;
 fmmCloud.refreshPromise=(async()=>{
  try{
   const body=new URLSearchParams({client_id:fmmCloud.clientId,grant_type:'refresh_token',refresh_token:fmmCloud.refreshToken,scope:FMM_CLOUD_SCOPES});
   const r=await fetch(FMM_CLOUD_AUTH_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),cache:'no-store'});
   const t=await r.json();if(!r.ok||!t.access_token)throw Error(t.error_description||'Refresh token no longer valid');
   fmmCloudAcceptToken(t);return fmmCloud.token;
  }catch(e){fmmCloud.token='';fmmCloud.refreshToken='';fmmCloud.expires=0;fmmCloudSaveSession();fmmCloudSetState('Sign in required · local edits retained','warn');throw Error('Microsoft needs a fresh sign-in. Your local changes remain safe.');}
  finally{fmmCloud.refreshPromise=null;}
 })();return fmmCloud.refreshPromise;

async function fmmGraph(path,init={},allow404=false){
 const token=await fmmCloudAuth();const headers=new Headers(init.headers||{});headers.set('Authorization','Bearer '+token);
 const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...init,headers,cache:'no-store'});

 if(!r.ok){let msg='';try{const j=await r.json();msg=j.error?.message||j.error_description||'';}catch(e){}
  if(r.status===412||r.status===409){fmmCloud.conflict=true;throw Error('OneDrive file changed during save; conflict detected. Your local edits are safe.');}
  throw Error((msg||'Microsoft Graph request failed')+' (HTTP '+r.status+')');}

}

async function fmmCloudApplyRemote(m,folder,silent=false){

 if(!save(true)){data=original;startupWarning=oldWarning;lastSavedSerialized=oldLast;throw Error('Browser storage rejected the cloud copy; original data retained');}

async function fmmCloudCheck({afterSignIn=false}={}){
 if(fmmCloud.working||fmmCloud.tabConflict)return;
 if(!fmmCloud.token&&!fmmCloud.refreshToken){fmmCloudSetState();return;}
 fmmCloud.working=true;let pushAfter=false;
 try{
  const folder=await fmmCloudFolder(),m=await fmmCloudMetadata(folder),b=fmmCloud.baseline;
  fmmCloud.folderId=folder;fmmCloud.remote=m?{etag:m.eTag||m.etag,modified:m.lastModifiedDateTime,newer:false}:null;
  if(!m){if(b){fmmCloud.conflict=true;fmmCloudSetState('OneDrive backup missing · local records protected','warn');}else fmmCloudSetState('OneDrive: no cloud backup yet','warn');return;}

async function fmmCloudUpload(){

  if(m&&etag!==b.etag){fmmCloud.conflict=true;throw Error('OneDrive changed on another device. Upload blocked. Review conflict.');}

 }catch(e){fmmCloud.dirty=true;fmmCloudSetState(fmmCloud.conflict?'OneDrive conflict · no data overwritten':'OneDrive: local edits not uploaded','warn');toast('OneDrive upload stopped: '+e.message);}

function fmmCloudSchedule(){

const fmm26CashMonthlyBefore=monthlyCash;
monthlyCash=function(count=12){
 const byMonth=new Map();
 for(const c of cashRows()){
  if(!cashEligible(c))continue;
  const m=month(c.date),v=byMonth.get(m)||{inflow:0,outflow:0,count:0};
  if(c.type==='in')v.inflow+=(+c.amount||0);else if(c.type==='out')v.outflow+=(+c.amount||0);
  v.count++;byMonth.set(m,v);
 }
 const from=month(data.settings.asOf||today()),start=objDate(from+'-01');
 const rows=[];let running=+data.settings.openingCash||0;
 for(let n=0;n<count;n++){
  const d=new Date(start);d.setUTCMonth(start.getUTCMonth()+n);const m=iso(d).slice(0,7),v=byMonth.get(m)||{inflow:0,outflow:0,count:0};
  const opening=running;running+=v.inflow-v.outflow;
  rows.push({m,opening,inflow:v.inflow,outflow:v.outflow,net:v.inflow-v.outflow,closing:running,count:v.count});
 }
 return rows;
};

function fmm27TaxStart(date){const d=objDate(date),y=d.getUTCFullYear();return date>=`${y}-04-06`?y:y-1;}

function fmm27MileageCalculated(){fmm27Ensure();const sorted=[...data.mileageTrips].sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id))), totals=new Map(),rows=[];
 for(const trip of sorted){const year=fmm27TaxStart(trip.date),vehicle=trip.vehicle||'UNSPECIFIED',claimant=trip.claimant||'',kind=trip.vehicleType||'carvan',miles=Number(trip.miles)||0,key=[year,claimant.trim().toLowerCase(),kind].join('|'),before=totals.get(key)||0;let cost=0,effective=0,tier='Custom rate';
  if(trip.rateMode==='custom'){effective=Number(trip.customRate)||0;cost=fmm27Round(miles*effective);tier='Custom';}
  else if(kind==='motorcycle'){effective=.24;cost=fmm27Round(miles*.24);tier='HMRC motorcycle';}
  else{const top=year>=2026?.55:.45,first=Math.max(0,Math.min(miles,10000-before)),rest=miles-first;cost=fmm27Round(first*top+rest*.25);effective=miles?cost/miles:top;tier=rest>0?'HMRC split rate':before>=10000?'HMRC 25p':'HMRC '+Math.round(top*100)+'p';}

function fmm27OptionLines(pid,chosen='',type=''){const q=fmmLinkedQuote(fmm27Job(pid));return '<option value="">Unallocated / no cost line</option>'+(q?.lines||[]).filter(l=>!type||l.type===type).map(l=>`<option value="${E(l.id)}" ${l.id===chosen?'selected':''}>${E((l.type||'Cost')+' · '+l.description.slice(0,75))}</option>`).join('');}
function fmm27Line(entry){const q=fmmLinkedQuote(fmm27Job(entry.projectId));return q?.lines.find(l=>l.id===entry.lineId)||null;}
function fmm27LoggedForLine(lineId,projectId){return fmm27Round(data.workLogs.filter(e=>e.projectId===projectId&&e.lineId===lineId).reduce((s,e)=>s+e.hours*e.rate,0)+data.expenseLogs.filter(e=>e.projectId===projectId&&e.lineId===lineId).reduce((s,e)=>s+e.amount,0));}
function fmm27SyncLine(projectId,lineId){if(!lineId)return;const line=fmm27Line({projectId,lineId});if(!line)throw Error('Linked cost item no longer exists');const logged=fmm27LoggedForLine(lineId,projectId);if(line.fmm27ManualActual===undefined){line.fmm27ManualActual=Math.max(0,Number(line.actual||0)-logged);}line.actual=fmm27Round(Number(line.fmm27ManualActual)+logged);}
function fmm27ApplyLineChange(oldEntry,newEntry){const pairs=new Map();for(const x of [oldEntry,newEntry])if(x?.lineId)pairs.set(x.projectId+'|'+x.lineId,[x.projectId,x.lineId]);for(const [p,l] of pairs.values())fmm27SyncLine(p,l);}
function fmm27Unallocated(pid){return fmm27Round(data.workLogs.filter(x=>x.projectId===pid&&!x.lineId).reduce((s,x)=>s+x.hours*x.rate,0)+data.expenseLogs.filter(x=>x.projectId===pid&&!x.lineId).reduce((s,x)=>s+x.amount,0));}
function fmm27JobSummary(p){const q=fmmLinkedQuote(p),t=q?fmmTotals(q):null,approved=data.variations.filter(v=>v.projectId===p.id&&v.status==='approved'),sell=fmm27Round(Number(p.contractValue||0)+approved.reduce((s,v)=>s+Number(v.sell||0),0)),costVariation=approved.reduce((s,v)=>s+Number(v.cost||0),0),unallocated=fmm27Unallocated(p.id),budgetForecast=t?t.forecast:costs(p),logged=fmm27Round(data.expenseLogs.filter(x=>x.projectId===p.id).reduce((s,x)=>s+x.amount,0)+data.workLogs.filter(x=>x.projectId===p.id).reduce((s,x)=>s+x.hours*x.rate,0)),miles=fmm27MileageCalculated().filter(x=>x.projectId===p.id).reduce((s,x)=>s+x.claimValue,0);return {sell,contract:p.contractValue||0,cost:fmm27Round(budgetForecast+costVariation+unallocated),profit:fmm27Round(sell-budgetForecast-costVariation-unallocated),mileage:fmm27Round(miles),profitAfterMileage:fmm27Round(sell-budgetForecast-costVariation-unallocated-miles),unallocated,logged,quote:t,variation:approved.length};}

 }else if(kind==='activity'){

  content=fmm28ListBox(d.entries.map(x=>`<button type="button" class="fmm28-drawer-item" data-fmm28-entry="${E(x.kind)}|${E(x.id)}"><span><strong>${E(x.title)}</strong><small>${E(x.detail)} · ${E(fmm28TextDate(x.date))}</small></span><span class="fmm28-arrow">›</span></button>`).join(''),'No entries yet.');
 }else if(kind==='shortcuts'){
  title='Quick actions';detail='Choose what you need to record; existing job data is reused.';
  content=`<div class="fmm28-draweractions"><button data-fmm28-add="workLogs">Log labour</button><button data-fmm28-add="expenseLogs">Record material / cost</button><button data-fmm28-add="mileageTrips">Log mileage</button><button data-fmm28-add="fieldNotes">Site note</button></div>`;
 }else return;
 fmm28ShowDrawer(title,detail,content,{type:'metric',kind});
}
function fmm28Project(pid,tab='overview'){
 const p=data.projects.find(x=>x.id===pid);if(!p){toast('Project not found');return;}
 const tabs=[['overview','Overview'],['costs','Budget & costs'],['programme','Programme'],['activity','Job entries'],['mileage','Mileage']];
 const tabhtml=`<div class="fmm28-drawer-tabs" role="tablist" aria-label="Project details">${tabs.map(([id,label])=>`<button class="fmm28-tab" role="tab" aria-selected="${id===tab}" type="button" data-fmm28-tab="${E(pid)}|${id}">${label}</button>`).join('')}</div>`;
 const q=fmmLinkedQuote(p),r=readiness(p),actions=`<div class="fmm28-draweractions"><button class="primary" type="button" data-fmm28-work="${E(pid)}">Open daily work →</button><button type="button" data-fmm28-hub="${E(pid)}">Original project hub</button><button type="button" data-fmm28-route="costing" data-fmm28-pid="${E(pid)}">Project budgets</button></div>`;
 let body='';
 if(tab==='overview'){
  body=`<div class="fmm28-metric-grid"><button class="fmm28-metric-mini" data-fmm28-tab="${E(pid)}|costs"><span>Quoted value</span><strong>${gbp(p.contractValue)}</strong></button><button class="fmm28-metric-mini" data-fmm28-tab="${E(pid)}|programme"><span>Target finish</span><strong style="font-size:15px">${E(fmm28TextDate(p.deadline))}</strong></button><button class="fmm28-metric-mini" data-fmm28-tab="${E(pid)}|programme"><span>Activities</span><strong>${(p.tasks||[]).length}</strong></button><button class="fmm28-metric-mini" data-fmm28-route="readiness" data-fmm28-pid="${E(pid)}"><span>Readiness</span><strong>${r.done}/${r.total}</strong></button></div>${actions}
   <div class="fmm28-drawerpanel"><h3>Job details</h3><div style="padding:14px 16px;display:grid;gap:12px"><div>${fmm28Status(p.status)} ${p.archivedAt?'<span class="fmm28-pill">Archived</span>':''}</div><div><strong>Client</strong><br>${E(p.client||'Not entered')}</div><div><strong>Site</strong><br>${E(p.site||'Not entered')}</div><div><strong>Dates</strong><br>${E(fmm28TextDate(p.start))} – ${E(fmm28TextDate(p.finish))}</div><div><strong>Job notes</strong><br>${E(p.notes||'No notes recorded')}</div></div></div>`;
 }else if(tab==='costs'){
  const s=fmm27JobSummary(p),t=s.quote,lines=q?.lines||[];
  body=`<div class="fmm28-metric-grid"><button class="fmm28-metric-mini" data-fmm28-route="costing" data-fmm28-pid="${E(pid)}"><span>Adjusted job value</span><strong>${FMM_CURRENCY(s.sell)}</strong></button><button class="fmm28-metric-mini" data-fmm28-route="costing" data-fmm28-pid="${E(pid)}"><span>Cost forecast</span><strong>${FMM_CURRENCY(s.cost)}</strong></button><button class="fmm28-metric-mini" data-fmm28-route="costing" data-fmm28-pid="${E(pid)}"><span>Forecast margin (pre mileage)</span><strong>${FMM_CURRENCY(s.profit)}</strong></button><button class="fmm28-metric-mini" data-fmm28-tab="${E(pid)}|mileage"><span>Recorded mileage estimate</span><strong>${FMM_CURRENCY(s.mileage)}</strong></button></div><p class="fmm28-drawer-hint">Forecasts are based on job budgets, recorded spend and approved variations. Mileage is shown separately and is not automatically an accounting claim.</p><div class="fmm28-draweractions"><button class="primary" data-fmm28-add="workLogs" data-fmm28-pid="${E(pid)}">+ Log labour</button><button data-fmm28-add="expenseLogs" data-fmm28-pid="${E(pid)}">+ Record cost</button>${q?`<button data-fmm28-quote="${E(q.id)}">Open itemised quote →</button>`:''}</div>
   ${fmm28ListBox(lines.slice(0,25).map(l=>`<button class="fmm28-drawer-item" type="button" data-fmm28-quote="${E(q.id)}" data-fmm28-line="${E(l.id)}"><span><strong>${E(l.description||'Cost line')}</strong><small>${E(l.type||'Cost')} · ${E(l.pkg||'Group')}</small></span><small>${FMM_CURRENCY(fmmLineCost(l).forecast)}</small><span class="fmm28-arrow">›</span></button>`).join(''),'No linked itemised quotation; see project budget for estimates.')} ${lines.length>25?'<p class="fmm28-drawer-hint">First 25 cost items shown. Open the quotation for the full breakdown.</p>':''}`;
 }else if(tab==='programme'){
  body=`<div class="fmm28-draweractions"><button class="primary" data-fmm28-route="project" data-fmm28-pid="${E(pid)}">Open full Gantt →</button><button data-fmm28-route="readiness" data-fmm28-pid="${E(pid)}">Readiness checks →</button></div>`+fmm28ListBox([...(p.tasks||[])].sort((a,b)=>a.start.localeCompare(b.start)).map(t=>`<button type="button" class="fmm28-drawer-item" data-fmm28-task="${E(pid)}|${E(t.id)}"><span><strong>${E(t.title)}</strong><small>${E(fmm28TextDate(t.start))} – ${E(fmm28TextDate(t.finish))} · ${E(t.resource||'Unassigned')}</small></span><span class="fmm28-pill">${E(t.status||'Planned')}</span><span class="fmm28-arrow">›</span></button>`).join(''),'No activities yet. Add one in the Gantt view.');
 }else if(tab==='activity'){
  const entries=[];for(const key of ['workLogs','expenseLogs','fieldNotes','variations','documentLinks'])for(const x of data[key]||[])if(x.projectId===pid)entries.push({kind:key,row:x,date:x.date||'',label:({workLogs:'Labour',expenseLogs:'Cost',fieldNotes:'Site note',variations:'Variation',documentLinks:'Document'})[key],title:x.description||x.text||x.title||x.worker||'Entry'});entries.sort((a,b)=>b.date.localeCompare(a.date));
  body=`<div class="fmm28-draweractions"><button class="primary" data-fmm28-add="fieldNotes" data-fmm28-pid="${E(pid)}">+ Site note</button><button data-fmm28-add="variations" data-fmm28-pid="${E(pid)}">+ Scope variation</button><button data-fmm28-add="documentLinks" data-fmm28-pid="${E(pid)}">+ Link document</button></div>`+fmm28ListBox(entries.slice(0,60).map(e=>`<button type="button" class="fmm28-drawer-item" data-fmm28-entry="${E(e.kind)}|${E(e.row.id)}"><span><strong>${E(e.label)} · ${E(String(e.title).slice(0,85))}</strong><small>${E(fmm28TextDate(e.date))}</small></span><span class="fmm28-arrow">›</span></button>`).join(''),'No job entries yet.');
 }else if(tab==='mileage'){
  const trips=fmm27MileageCalculated().filter(x=>x.projectId===pid).sort((a,b)=>b.date.localeCompare(a.date)),miles=trips.reduce((a,b)=>a+b.miles,0);
  body=`<div class="fmm28-metric-grid"><button class="fmm28-metric-mini" data-fmm28-route="mileage" data-fmm28-pid="${E(pid)}"><span>Recorded business miles</span><strong>${fmm28Abs(miles)}</strong></button><button class="fmm28-metric-mini" data-fmm28-route="mileage" data-fmm28-pid="${E(pid)}"><span>Estimated mileage cost</span><strong>${FMM_CURRENCY(trips.reduce((s,x)=>s+x.claimValue,0))}</strong></button></div><div class="fmm28-draweractions"><button class="primary" data-fmm28-add="mileageTrips" data-fmm28-pid="${E(pid)}">+ Log journey</button><button data-fmm28-route="mileage" data-fmm28-pid="${E(pid)}">Full mileage register →</button></div>`+fmm28ListBox(trips.map(x=>`<button class="fmm28-drawer-item" data-fmm28-entry="mileageTrips|${E(x.id)}" type="button"><span><strong>${E(x.purpose||'Journey')}</strong><small>${E(fmm28TextDate(x.date))} · ${E(x.origin||'')} → ${E(x.destination||'')}</small></span><span>${fmm28Abs(x.miles)} mi</span><span class="fmm28-arrow">›</span></button>`).join(''),'No business journeys assigned to this project.');
 }
 fmm28ShowDrawer(fmm28Name(p),`${p.client||'No client'} · ${FMM28_STATUS[p.status]||p.status}${p.archivedAt?' · Archived':''}`,tabhtml+body,{type:'project',pid,tab});
}
function fmm28Nav(view,pid=''){
 fmm28CloseDrawer();if(pid&&data.projects.some(p=>p.id===pid))data.currentProject=pid;
 if(view==='mileage'&&pid)fmm27MileageScope=pid;
 data.view=view;save();render();document.querySelector('.stage')?.scrollTo({top:0,behavior:'instant'});
}
function fmm28Issue(key){const i=fmm28Calc().issues.find(x=>x.key===key);if(!i){fmm28Metric('attention');return;}if(i.pid){fmm28Project(i.pid,i.kind==='tasks'||i.kind==='programme'?'programme':'overview');return;}fmm28Nav(i.kind==='resources'?'resources':'readiness');}
function fmm28Task(value){const [pid,tid]=value.split('|'),p=data.projects.find(x=>x.id===pid),t=p?.tasks.find(x=>x.id===tid);if(!p||!t){toast('Activity not found');return;}fmm28CloseDrawer();data.currentProject=pid;data.view='project';save();render();taskModal(t);}
function fmm28Entry(value){const [kind,rid]=value.split('|');fmm28CloseDrawer();fmm27OpenEdit(kind,rid);}
function fmm28Chrome(){
 if(startupWarning)return;
 document.body.classList.add('fmm28-ready');
 const nav=document.querySelector('#nav');
 if(nav){
  const preferred=[['dashboard','⌂  Overview'],['workspace','▣  Daily work'],['costing','▤  Projects & budgets'],['quotations','▦  Quotations'],['mileage','↗  Mileage & costs']];
  const planning=[['portfolio','▥  Master programme'],['project','◷  Individual schedule'],['resources','♧  Resources'],['readiness','☑  Readiness']];
  const records=[['archive','▤  Completed jobs'],['cashflow','▥  Cashflow forecast']];
  const buttons=[...nav.querySelectorAll('button[data-view]')],by=new Map(buttons.map(x=>[x.dataset.view,x]));
  if(buttons.length>=10&&!nav.querySelector('.fmm28-navheading')){
   const makeGroup=(items,title)=>{let x=document.createElement('div');x.className='fmm28-navgroup';if(title){let label=document.createElement('span');label.className='fmm28-navheading';label.textContent=title;x.append(label);}for(const [key,text] of items){let b=by.get(key);if(b){b.textContent=text;x.append(b);}}return x;};
   const createMore=(items,title)=>{let det=document.createElement('details');det.className='fmm28-navmore';let s=document.createElement('summary');s.textContent=title;det.append(s,makeGroup(items,''));if(items.some(([key])=>data.view===key))det.open=true;return det;};
   nav.replaceChildren(makeGroup(preferred,'Workspace'),createMore(planning,'Planning & resources'),createMore(records,'History & forecasts'));
  }
  for(const details of nav.querySelectorAll('.fmm28-navmore'))if(details.querySelector('button.active'))details.open=true;
 }
 const logo=document.querySelector('.brand #logo');
 if(logo&&!logo.closest('.fmm28-brandhome')){const wrap=document.createElement('button');wrap.type='button';wrap.className='fmm28-brandhome';wrap.dataset.view='dashboard';wrap.setAttribute('aria-label','Return to business overview');logo.parentNode.insertBefore(wrap,logo);wrap.append(logo);}
 const top=document.querySelector('.top .actions');
 if(top&&!top.querySelector('#fmm28TopSearch')){
  const search=document.createElement('button');search.id='fmm28TopSearch';search.className='fmm28-global-search';search.type='button';search.innerHTML='⌕ &nbsp; Search <kbd>Ctrl K</kbd>';search.setAttribute('data-fmm26-launch','search');top.insertBefore(search,top.firstChild);
  const tools=document.createElement('details');tools.className='fmm28-tools';tools.id='fmm28Tools';tools.innerHTML='<summary>Tools</summary><div class="fmm28-tools-pop"></div>';
  const dropdown=tools.querySelector('.fmm28-tools-pop');
  for(const btn of [...top.querySelectorAll('button[data-action]')])if(['import','backup','undo','print','exportAll','newQuote'].includes(btn.dataset.action)){btn.classList.remove('dark');dropdown.append(btn);}
  const saveState=top.querySelector('#saveState');if(saveState)dropdown.insertBefore(saveState,dropdown.firstChild);
  top.append(tools);
 }
 const root=document.getElementById('fmm28DrawerRoot');if(!root){const el=document.createElement('div');el.id='fmm28DrawerRoot';el.className='fmm28-drawerroot';el.hidden=true;document.body.append(el);}
}
const fmm28PreviousRender=render;
render=function(...args){
 if(!startupWarning&&data.view==='dashboard'){
  fmm27Ensure();const undo=$('#undoButton');if(undo)undo.disabled=undoStack.length===0;
  $('#heading').textContent='Business overview';$('#eyebrow').textContent='Fix & Mend Medway · Operations centre';
  $('#page').innerHTML=fmm28Home();$('#logo').src=LOGO_DATA;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===data.view));
  fmm26Decorate();fmm261Decorate();fmm27Decorate();fmm28Chrome();return;
 }
 const value=fmm28PreviousRender(...args);fmm28Chrome();return value;
};
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-fmm28-metric],[data-fmm28-filter],[data-fmm28-project],[data-fmm28-issue],[data-fmm28-task],[data-fmm28-entry],[data-fmm28-tab],[data-fmm28-route],[data-fmm28-quote],[data-fmm28-work],[data-fmm28-hub],[data-fmm28-add],[data-fmm28-back],[data-fmm28-close]');
 if(!el)return;event.preventDefault();event.stopImmediatePropagation();
 const d=el.dataset;
 if('fmm28Close' in d){fmm28CloseDrawer();return;}
 if('fmm28Back' in d){const old=fmm28DrawerHistory.pop();if(old?.type==='metric'){fmm28Metric(old.kind);}else fmm28CloseDrawer();return;}
 if(d.fmm28Filter){fmm28Filter=d.fmm28Filter;render();return;}
 if(d.fmm28Metric){fmm28Metric(d.fmm28Metric);return;}
 if(d.fmm28Project){fmm28Project(d.fmm28Project);return;}
 if(d.fmm28Issue){fmm28Issue(d.fmm28Issue);return;}
 if(d.fmm28Task){fmm28Task(d.fmm28Task);return;}
 if(d.fmm28Entry){fmm28Entry(d.fmm28Entry);return;}
 if(d.fmm28Tab){const [pid,tab]=d.fmm28Tab.split('|');fmm28Project(pid,tab);return;}
 if(d.fmm28Route){fmm28Nav(d.fmm28Route,d.fmm28Pid||'');return;}
 if(d.fmm28Work){fmm28Nav('workspace',d.fmm28Work);return;}
 if(d.fmm28Hub){fmm28CloseDrawer();fmm26OpenHub(d.fmm28Hub);return;}
 if(d.fmm28Quote){fmm28CloseDrawer();fmm26OpenQuote(d.fmm28Quote,d.fmm28Line||'');return;}
 if(d.fmm28Add){fmm28CloseDrawer();fmm27OpenAdd(d.fmm28Add,d.fmm28Pid||'');return;}
},true);
document.addEventListener('keydown',event=>{
 const root=document.querySelector('#fmm28DrawerRoot');if(!root||root.hidden)return;
 if(event.key==='Escape'){event.stopImmediatePropagation();fmm28CloseDrawer();return;}
 if(event.key==='Tab'){
  const btns=[...root.querySelectorAll('button:not([disabled])')].filter(b=>b.getClientRects().length);
  const i=btns.indexOf(document.activeElement);
  if(event.shiftKey&&i===0){event.preventDefault();btns.at(-1)?.focus();}
  else if(!event.shiftKey&&i===btns.length-1){event.preventDefault();btns[0]?.focus();}
 }
},true);
window.FMMCompany.version='2.8.0';
window.FMMCompany.dashboardOverview=fmm28Calc;
document.title='FMM Operations v2.8 — Business Overview';
if(document.querySelector('.brand small'))document.querySelector('.brand small').textContent='FMM OPERATIONS · V2.8';
render();

</script></body></html>
